[project]
name = "new-in-nyc"
version = "0.1.0"
description = "New in NYC: a research agent for people settling into New York, built on city housing records, free events and furnishing costs (FastAPI + LiteLLM + Gemini)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
]
